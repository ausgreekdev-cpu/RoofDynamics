name: Android Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Build web assets
        working-directory: frontend
        run: npm run build
      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android
      - name: Decode keystore (release only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > frontend/android/app/roofdynamics-release.jks
          echo "ROOFDYNAMICS_KEYSTORE_PATH=$PWD/frontend/android/app/roofdynamics-release.jks" >> $GITHUB_ENV
      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        working-directory: frontend/android
        run: ./gradlew assembleDebug
      - name: Build release AAB
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: frontend/android
        env:
          ROOFDYNAMICS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ROOFDYNAMICS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ROOFDYNAMICS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            frontend/android/app/build/outputs/apk/debug/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
