apply plugin: "com.android.application"

android {
    namespace "com.ausgreek.roofdynamics"
    compileSdk 35

    defaultConfig {
        applicationId "com.ausgreek.roofdynamics"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        // 64-bit only (Google Play requirement)
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }

    signingConfigs {
        release {
            if (System.getenv("ROOFDYNAMICS_KEYSTORE_PATH")) {
                storeFile file(System.getenv("ROOFDYNAMICS_KEYSTORE_PATH"))
                storePassword System.getenv("ROOFDYNAMICS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ROOFDYNAMICS_KEY_ALIAS") ?: "roofdynamics"
                keyPassword System.getenv("ROOFDYNAMICS_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (System.getenv("ROOFDYNAMICS_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Capacitor web assets are synced into this folder by `npx cap sync android`.
    sourceSets {
        main {
            assets.srcDirs = ["src/main/assets"]
        }
    }
}

repositories {
    flatDir {
        dirs "src/main/libs"
    }
}

dependencies {
    implementation fileTree(include: ["*.jar"], dir: "libs")
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "com.capacitorjs:core:6.2.0"
    // Capacitor plugins are pulled in by `npx cap sync android` from node_modules.
}

// Capacitor auto-generates this task wiring via the Capacitor Gradle plugin
// once `npx cap add android` has been run. Until then, run the documented
// setup steps in android/README.md.
